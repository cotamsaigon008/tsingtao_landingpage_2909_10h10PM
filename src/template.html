/* =====================================================================
   THE RING — 37 cards on a cylinder with the camera AT the ring centre.
   R = 891 = perspective, so each card is tangent to the cylinder and faces
   the camera exactly; the vertical sides with a slanted top edge is genuine
   PERSPECTIVE, not rotation. step = 360/37 = 9.7297deg, cull = 42deg.
   ===================================================================== */
const R = 891, PERSP = 891, N = 37, CULL = 42, SPEED = 1.9;
const STEP = 360 / N, PLANE_Y = 616, HORIZON_Y = 918;
let phase = -2, last = 0, cards = [];
const reduced = matchMedia('(prefers-reduced-motion: reduce)');

function buildRing(){
  const ring = document.getElementById('ring');
  let html = '';
  for(let i=0;i<N;i++){
    const d = SHOTS[i % SHOTS.length];
    html += '<div class="card">' + creative(d) + '<div class="edge"></div></div>';
  }
  ring.innerHTML = html;
  cards = Array.prototype.slice.call(ring.children);
  cards.forEach(function(c){
    const im = c.querySelector('img');
    if(im && !im.dataset.bound){
      im.dataset.bound = '1';
      im.addEventListener('error', function(){ c.classList.add('broken'); });
    }
  });
  placeCards();
}

function placeCards(){
  for(let i=0;i<cards.length;i++){
    const el = cards[i];
    const a = ((i*STEP + phase) % 360 + 540) % 360 - 180;   // signed angle -180..180
    if(Math.abs(a) > CULL){ el.style.visibility = 'hidden'; continue; }
    el.style.visibility = 'visible';
    const r = a * Math.PI/180, c = Math.cos(r);
    el.style.transform =
      'translate3d(' + (R*Math.sin(r)).toFixed(2) + 'px,0,' + (R*(1-c)).toFixed(2) + 'px) rotateY(' + (-a).toFixed(3) + 'deg)';
    el.style.filter = 'brightness(' + (0.84 + 0.5*(1/c - 1)).toFixed(3) + ')';
  }
}

function tick(t){
  if(!last) last = t;
  const dt = Math.min((t - last)/1000, .1);      // clamp so a janky frame can't leap
  last = t;
  if(!reduced.matches) phase -= SPEED * dt;      // continuous, never resets
  placeCards();
  requestAnimationFrame(tick);
}
/* a backgrounded tab must not jump forward when it comes back */
document.addEventListener('visibilitychange', function(){ last = 0; });
reduced.addEventListener && reduced.addEventListener('change', placeCards);

/* =====================================================================
   THE TYPE FITTER — desktop + tablet only.
   Font metrics are read from a detached canvas 2D context so the result is
   exact whatever face actually loads.
   ===================================================================== */
const cv2 = document.createElement('canvas').getContext('2d');
const TAB_MAX = 1080, TAB_MIN = 701, DW_MIN = 920;
const CW = 1172;                                   // desktop design width
let k = 1, isPhone = false, isTablet = false, tboost = 1;

const FIT = [$('h1a'), $('h1b'), $('sub1'), $('sub2'), $('badgeTxt'),
            $('ctaLabel'), $('vpLabel')];

function fontOf(el){
  const cs = getComputedStyle(el);
  return {css: cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily,
          size: parseFloat(cs.fontSize)};
}
/* cap height per 1px of font-size, measured on a real 'H' at 100px */
function capRatio(el){
  const f = fontOf(el);
  cv2.font = f.css.replace(f.size + 'px', '100px');
  const m = cv2.measureText('H');
  return (m.actualBoundingBoxAscent || 70) / 100;
}
/* design-pixel width: the canvas is scaled by k, so undo that */
function inkWidth(el){ return el.getBoundingClientRect().width / (isPhone ? 1 : k); }

function fitBox(el, tw, tc, pre){
  el.style.transform = pre || '';
  el.style.fontSize = (tc / capRatio(el)) + 'px';
  el.style.transform = (pre || '') + ' scaleX(' + (tw / inkWidth(el)) + ')';
}
function baseline(el, y){
  const f = fontOf(el);
  cv2.font = f.css;
  const m = cv2.measureText('Hg');
  const A = m.fontBoundingBoxAscent  || f.size * .8;
  const D = m.fontBoundingBoxDescent || f.size * .2;
  el.style.top = (y - ((f.size - (A + D)) / 2 + A)) + 'px';
}
/* optical centring: put a zero-size inline probe INSIDE the label so it rides the
   span's own baseline, read that baseline off the button, then offset the label
   so its CAP sits at the middle (BIAS 1.1 — the reference sits ~0.6px low) */
function centreLabel(btn, el, capPx){
  const probe = document.createElement('i');
  probe.style.cssText = 'display:inline-block;width:0;height:0;vertical-align:baseline';
  el.appendChild(probe);
  const base = (probe.getBoundingClientRect().top - btn.getBoundingClientRect().top) / (isPhone ? 1 : k);
  el.removeChild(probe);
  el.style.top = (btn.offsetHeight/2) - (base - capPx/2) + 1.1 + 'px';
}

function layout(){
  if(isPhone){
    /* hand back EVERY inline style the fitter wrote, so resizing down from a
       desktop width cannot leave a stray transform shifting the headline off-screen */
    FIT.forEach(function(el){
      el.style.fontSize = ''; el.style.top = ''; el.style.transform = '';
    });
    const links = $('links');
    links.style.transform = ''; links.style.fontSize = '';
    Array.prototype.forEach.call(links.children, function(a){ a.style.fontSize = ''; });
    document.querySelectorAll('.cta2 span, .nav .btn span').forEach(function(s){ s.style.top = ''; });
    placeCards();
    return;
  }

  const I = INK[LANG] || INK.en;
  const T_ = tboost;
  fitBox($('h1a'), I.h1a*T_, 37.2*T_, 'translateX(-50%)'); baseline($('h1a'), 204.5);
  fitBox($('h1b'), I.h1b*T_, 37.2*T_, 'translateX(-50%)'); baseline($('h1b'), 258.5);
  fitBox($('sub1'), I.sub1*T_,  8.4*T_, 'translateX(-50%)'); baseline($('sub1'), 300.5);
  fitBox($('sub2'), I.sub2*T_,  8.4*T_, 'translateX(-50%)'); baseline($('sub2'), 316.5);
  fitBox($('badgeTxt'), I.badge*T_, 12*T_);
  fitBox($('ctaLabel'), I.cta*T_, 8.9*T_); centreLabel($('ctaLabel').parentNode, $('ctaLabel'),  8.9*T_);
  fitBox($('vpLabel'),  I.vp*T_,  9.5*T_); centreLabel($('vpLabel').parentNode,  $('vpLabel'),   9.5*T_);

  const links = $('links');
  links.style.transform = '';
  if(isTablet){
    Array.prototype.forEach.call(links.children, function(a){ a.style.fontSize = ''; });
  }else{
    // one shared size for all five, derived from the first child's cap ratio
    const fs = 7.9 / capRatio(links.firstElementChild);
    Array.prototype.forEach.call(links.children, function(a){ a.style.fontSize = fs + 'px'; });
    const rowW = links.getBoundingClientRect().width / k;
    links.style.transform = 'scaleX(' + (I.links / rowW) + ')';
  }
  placeCards();
}

/* =====================================================================
   RESPONSIVE — three distinct architectures.
   Scale law: k = min(vw/W, vh/560). 560 (not 657) is the height divisor on
   purpose: it fills the width and lets the browser mock bleed off the
   bottom edge rather than letterboxing the composition.
   ===================================================================== */
const canvas = $('canvas');
/* declared up here, not beside the drawer code: the entrance timeline runs
   before that block and touches the hint element */
const stage = $('stage'), mockEl = $('browser'), hintEl = $('peekhint');
let peeked = false, wheelLock = 0;
function resize(){
  const vw = window.innerWidth, vh = window.innerHeight;
  isPhone   = vw <= 700;
  isTablet  = !isPhone && vw <= TAB_MAX;
  tboost    = 1;

  if(isPhone){
    k = 1;
    canvas.style.removeProperty('--k');
    canvas.style.removeProperty('--fill');
  }else{
    let W = CW;
    if(isTablet){
      // narrow the design WINDOW so type stops shrinking with the viewport,
      // while k stays CONTINUOUS at 1080 (no visible jump across the breakpoint)
      W = DW_MIN + (vw - TAB_MIN) * (CW - DW_MIN) / (TAB_MAX - TAB_MIN);
      if(vh > vw*1.15) W = Math.min(W, 900);          // portrait tablet: read larger
    }
    k = Math.min(vw / W, vh / 560);
    canvas.style.setProperty('--k', k);

    let fill = Math.max(0, vh/k - 657);
    if(isTablet && fill > 0){
      // share the surplus height THREE ways
      const ramp  = Math.min(1, (TAB_MAX - vw) / 120);   // ease the change in over 120px
      tboost      = 1 + 0.14 * ramp;                     // ink-target multiplier for type
      const ss    = Math.min(fill*0.55, 420) * ramp;      // wheel + mock travel to the foot
      const rs    = 1 + Math.min(fill/1100, 0.75) * ramp;// wheel grows = a closer camera
      const slack = 219.5 - 125*rs + ss;
      const st    = Math.max(0, slack/2 - 28) * ramp;     // hero drops to sit centred
      fill       -= ss;                                  // mock keeps only what's left
      canvas.style.setProperty('--sshift', ss + 'px');
      canvas.style.setProperty('--rs', rs);
      canvas.style.setProperty('--stshift', st + 'px');
    }else{
      canvas.style.setProperty('--sshift', '0px');
      canvas.style.setProperty('--rs', 1);
      canvas.style.setProperty('--stshift', '0px');
    }
    canvas.style.setProperty('--fill', fill + 'px');
  }
  layout();
  if(peeked) setPeek(true, true);      /* keep the drawer correct across resizes */
  if(vw <= 1080) closeMenu(true);
}

addEventListener('resize', resize);
if(window.visualViewport) visualViewport.addEventListener('resize', resize);

function closeMenu(silent){

  nav.classList.remove('open');

/* =====================================================================
   MASTER ENTRANCE TIMELINE — runs exactly once, then the page is still.
   ===================================================================== */
(function intro(){
  const root = document.documentElement;
  function settle(){
    /* Cancelling every animation we created is enough to unstick fill:'both'.
       The resting values are deliberately NOT written as inline styles here:
       inline beats any stylesheet rule, and #lang's resting state is owned by
       .stage.peek (the hero pill steps aside while the storefront is up), so
       stamping opacity on it inline pinned the pill visible over the store. */
    made.forEach(function(a){ try{ a.cancel(); }catch(e){ /* already gone */ } });
    root.classList.remove('intro');
  }
  if(!root.classList.contains('intro') ||
     matchMedia('(prefers-reduced-motion: reduce)').matches ||
     !Element.prototype.animate){ settle(); return; }

  const D    = innerWidth <= 700 ? .66 : 1;          // phones travel shorter distances
  /* The animations are cancelled from this list, not by scanning
     getAnimations() for an id we assigned to them. Anything created with
     fill:'both' whose timeline is throttled — a background tab, a page opened
     before it is painted — never advances and then holds its FIRST keyframe
     forever. That is not hypothetical: it parked the storefront 17px low and
     the drawer's close button 6.6px down, in every locale, with the intro class
     already removed so nothing looked like it was still animating. */
  const made = [];
  const EXPO = 'cubic-bezier(.16,1,.3,1)', SOFT = 'cubic-bezier(.22,.61,.36,1)';
  const Y = px => '0 ' + (px * D) + 'px';
  let n = 0, last = null;

  function play(el, from, dur, delay, ease){
    if(!el) return;
    const to = {opacity:1};
    if('translate' in from) to.translate = '0 0';
    if('scale'    in from) to.scale = '1';
    if('clipPath' in from) to.clipPath = 'inset(-30% 0 -30% 0)';
    const a = el.animate([from, to], {duration:dur, delay:delay, easing:ease, fill:'both'});
    a.id = 'intro:' + n++;
    made.push(a);
    last = a;
  }

  const links = document.querySelectorAll('#links a');

  /* the frame settles */
  play(nav,  {opacity:0, translate:Y(-9)},                                   620,   60, EXPO);
  play(hintEl, {opacity:0, translate:Y(10)},                                  560,  640, SOFT);
  play($('canvas').querySelector('.mark'), {opacity:0, translate:Y(6)},        520,  150, SOFT);
  play($('canvas').querySelector('.wm'),   {opacity:0, translate:Y(6)},        520,  185, SOFT);
  links.forEach(function(a, i){ play(a, {opacity:0, translate:Y(6)},         460, 215 + i*45, SOFT); });
  play(burger, {opacity:0, translate:Y(6)},                                  460,  300, SOFT);
  play($('canvas').querySelector('.nav .btn'), {opacity:0, translate:Y(6)},   500,  400, SOFT);
  play($('lang'), {opacity:0, translate:Y(-9)},                                560,  120, EXPO);

  /* context, then the message */
  play($('canvas').querySelector('.badge'), {opacity:0, translate:Y(11), scale:.985},        560, 270, EXPO);
  play($('h1a'),  {opacity:0, translate:Y(15), clipPath:'inset(100% 0 -30% 0)'},              900, 380, EXPO);
  play($('h1b'),  {opacity:0, translate:Y(15), clipPath:'inset(100% 0 -30% 0)'},              900, 470, EXPO);
  play($('sub1'), {opacity:0, translate:Y(10)},                                                620, 690, EXPO);
  play($('sub2'), {opacity:0, translate:Y(10)},                                                620, 745, EXPO);
  play($('canvas').querySelector('.cta2'), {opacity:0, translate:Y(13), scale:.985},           620, 830, EXPO);

  /* the payoff — the wheel rises into depth, the mock lands in FRONT of it last */
  play($('ring'),    {opacity:0, translate:Y(18), scale:.99},                                 950,  700, EXPO);
  play($('browser'), {opacity:0, translate:Y(26)},                                            900,  900, EXPO);
  play(document.querySelector('.fbtn.wa'),   {opacity:0, scale:.88},                               500, 1260, EXPO);
  play(document.querySelector('.fbtn.zalo'), {opacity:0, scale:.88},                               500, 1330, EXPO);

  if(last) last.finished.then(settle, settle);   // nothing survives: the last
  /* The promise above is the fast path, but it only resolves if the animation
     timeline actually advances. A tab that is backgrounded or occluded throttles
     that timeline; every fill:'both' effect then holds its FIRST keyframe, and
     the page settles with the headline at opacity 0 behind inset(100%) - a
     completely blank hero. A plain timer is not gated on the animation
     timeline, so it carries the guarantee. 2200ms clears the longest frame
     (950ms duration + 900ms delay). */
  setTimeout(settle, 2200);
                                                 // frame IS the authored design
})();

/* =====================================================================
   STOREFRONT DRAWER
   The page itself never scrolls (that is the shell's whole point), so the
   store front is reached by pulling the mock up. Two moves only:
     - translate the canvas up by exactly the mock's offset, so the mock's top
       edge lands on the top of the stage
     - give the mock the viewport's full height, measured in DESIGN px
   The hero above is not touched, so until you pull, the composition is still
   pixel-for-pixel as authored.
   ===================================================================== */
function mockTopDesign(){
  const m = mockEl.getBoundingClientRect(), c = canvas.getBoundingClientRect();
  return (m.top - c.top) / k;
}

function setPeek(on, force){
  if(on === peeked && !force) return;
  peeked = on;
  stage.classList.toggle('peek', on);
  hintEl.setAttribute('aria-expanded', on ? 'true' : 'false');
  hintEl.querySelector('.lbl').textContent = on ? L().peekClose : L().peekOpen;
  canvas.classList.add('anim');
  mockEl.classList.add('anim');
  if(on){
    // negative, because translateY composes ADDITIVELY after scale()
    canvas.style.setProperty('--peek', (-mockTopDesign()) + 'px');
    mockEl.style.height = (window.innerHeight / k) + 'px';   // full stage, in design px
  }else{
    canvas.style.setProperty('--peek', '0px');
    mockEl.style.height = '';
  }
  var done = function(){
    canvas.classList.remove('anim');
    mockEl.classList.remove('anim');
    window.removeEventListener('transitionend', done);
  };
  window.addEventListener('transitionend', done);
  // belt and braces if the transition never fires (reduced motion, hidden tab)
  setTimeout(done, 900);
}

hintEl.addEventListener('click', function(){
  if(!$('sheet').hidden || !$('leadForm').hidden) return;   // a dialog owns Escape
  setPeek(!peeked);
});

/* wheel + touch: down pulls the storefront up, up puts the hero back */
window.addEventListener('wheel', function(e){
  if(!$('sheet').hidden || !$('leadForm').hidden) return;
  if(Math.abs(e.deltaY) < 8) return;
  const now = Date.now();
  if(now - wheelLock < 700) return;
  if(e.deltaY > 0 && !peeked){ wheelLock = now; setPeek(true); }
  else if(e.deltaY < 0 && peeked){ wheelLock = now; setPeek(false); }
}, {passive:true});

var touchY = null;
window.addEventListener('touchstart', function(e){ touchY = e.touches[0].clientY; }, {passive:true});
window.addEventListener('touchend', function(e){
  if(touchY === null) return;
  if(!$('sheet').hidden || !$('leadForm').hidden){ touchY = null; return; }
  // once open, a drag inside the store content is a scroll, not a drawer gesture
  if(peeked && e.target && e.target.closest && e.target.closest('.pagebody')){ touchY = null; return; }
  var dy = touchY - (e.changedTouches[0] ? e.changedTouches[0].clientY : touchY);
  if(Math.abs(dy) > 60) setPeek(dy > 0);
  touchY = null;
}, {passive:true});

window.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && !$('sheet').hidden){ closeSheet(); return; }
  if(e.key === 'Escape' && openProduct){ closeDetail(); return; }
  if(e.key === 'Escape' && peeked){ setPeek(false); hintEl.focus(); return; }
  // e.target is `window` for events dispatched at the document, and window has
  // no closest() — guard before probing
  if(e.target && e.target.closest && e.target.closest('input,textarea,select')) return;
  if(!$('sheet').hidden || !$('leadForm').hidden) return;
  if(e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === 'End'){ if(!peeked){ setPeek(true); e.preventDefault(); } }
  else if(e.key === 'ArrowUp' || e.key === 'PageUp'){ if(peeked){ setPeek(false); e.preventDefault(); } }
});

/* ================= language switch =================
   Two controls, one language. The floating pill belongs to the hero; the store
   carries its own in the mock's browser chrome, because the pill is an overlay
   on the stage and would otherwise sit on top of the store when it is pulled
   up. Both delegate to the same applyLang, so neither can fall out of sync. */
document.addEventListener('click', function(e){
  const b = e.target.closest('button[data-lang]');
  if(b) applyLang(b.dataset.lang);
});

/* ================= go ================= */
/* The official Tsingtao lockup sits in the badge's leading slot. It is
   decorative — the label beside it already spells the brand — so the alt is
   empty and the tile carries the accessible name instead. Wired down here
   because $ and U are declared further down than the store section. */
buildRing();            /* paint the ring before the first frame */
(function(){
  let initial = 'vi';
  try{
    const saved = localStorage.getItem('tsingtao-lang');
    if(saved && I18N[saved]) initial = saved;
    else{
      const nav = (navigator.language || 'vi').toLowerCase();
      if(nav.indexOf('zh') === 0) initial = 'zh';
      else if(nav.indexOf('en') === 0) initial = 'en';
    }
  }catch(err){ /* private mode: fall through to the default */ }
  applyLang(initial, {silent:true});
})();

/* Both contact buttons are plain anchors so they work with JavaScript disabled,
   open in a new tab on a phone, and never need a click handler. Wired here, at
   the very end, because CHANNELS is a const further up and reading it from
   anywhere earlier is a temporal-dead-zone crash that kills the whole script. */
const zaloBtn = $('zaloBtn'), waBtn = document.querySelector('.wa[aria-label="WhatsApp"]');
zaloBtn.href = CHANNELS.zalo;
$('zaloMark').src = U('_zalo');
waBtn.href   = CHANNELS.whatsapp;
[zaloBtn, waBtn].forEach(function(a){ a.target = '_blank'; a.rel = 'noopener'; });

resize();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
setTimeout(layout, 400);
setTimeout(layout, 1400);
requestAnimationFrame(tick);
</script>
</body>
</html>
