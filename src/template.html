<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<title>TSINGTAO — Dòng bia chính hãng tại Việt Nam</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Dòng bia Tsingtao chính hãng tại Việt Nam: lager truyền thống, bia không cồn, bia thảo mộc và nước soda. Khám phá đủ 10 dòng sản phẩm và đăng ký nhận báo giá sỉ.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<script>
/* Armed before first paint so the entrance timeline can never lose the race
   against layout. The 4s failsafe guarantees content is never stranded hidden. */
document.documentElement.classList.add('intro');
setTimeout(function(){document.documentElement.classList.remove('intro');},4000);
</script>
<style>
/* ============ 0. RESET ============ */
*{margin:0;padding:0;box-sizing:border-box}
/* ================= BRAND TOKENS =================
   Pulled verbatim from the live site's stylesheet so this page and
   tsingtaovietnam.com cannot drift apart. Rename a value here and the whole
   surface follows.
     forest-950 #001f16  page base        forest-700 #006b3d  hover / lift
     forest-900 #003b26  raised surface   forest-500 #008a48  active accent
     aged-gold  #b68a3a  the site's --stage-accent
     label-red  #c62d2d  the seal in the mark
     paper-50   #f8f5ed  store surface
   ================================================= */
:root{
  --tsg-forest-950:#001f16; --tsg-forest-900:#003b26; --tsg-forest-700:#006b3d;
  --tsg-forest-500:#008a48; --tsg-gold:#b68a3a;  --tsg-gold-soft:#f4dfb0;
  --tsg-red:#c62d2d;         --tsg-paper:#f8f5ed; --tsg-aluminium:#c5cac7;
}
html,body{height:100%;overflow:hidden;background:var(--tsg-forest-950)}
body{font-family:Poppins,Inter,system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}                      /* button labels must never underline */
img{max-width:100%}
button{font:inherit;color:inherit}

/* ============ 1. GLOBAL SHELL — a fixed canvas that is scaled ============ */
.stage{position:fixed;inset:0;overflow:hidden;background:var(--tsg-forest-950)}
.canvas{position:absolute;left:50%;top:0;width:1172px;height:657px;
  transform:translateX(-50%) scale(var(--k,1)) translateY(var(--peek,0px));
  transform-origin:50% 0}
/* the drawer transition lives on a class that only exists while the drawer is
   actually moving, so a window resize never animates the scale */
.canvas.anim{transition:transform .58s cubic-bezier(.22,.61,.36,1)}
.canvas>*{position:absolute}
/* layout shell, no box of its own — inset:0 makes it a full-canvas hit area,
   so it must not swallow clicks meant for the browser mock beneath it */
.stack{position:absolute;inset:0;z-index:300;pointer-events:none}
.stack>*{pointer-events:auto}
.stack>*{position:absolute}
.navmenu{display:contents}                      /* invisible shell on desktop */
.burger{display:none}                           /* desktop */

/* The stage wash now comes from the brand tokens rather than a generic blue:
   a deep forest lift off the foot of the canvas, a warmer gold kiss at the very
   bottom edge to pick up the aged-gold ring on the mark, and the same vertical
   rhythm the original gradient used. */
.bg{position:absolute;inset:0;
  background:
   radial-gradient(120% 62% at 50% 118%, rgba(0,107,61,.30) 0%, rgba(0,107,61,0) 62%),
   linear-gradient(180deg,
     rgba(0,31,22,0) 34%,
     rgba(0,59,38,.20) 56%,
     rgba(0,107,61,.16) 74%,
     rgba(182,138,58,.075) 92%,
     rgba(182,138,58,.11) 100%),
   var(--tsg-forest-950)}

/* two 1x1px dots whose entire star field is one giant box-shadow list (JS) */
.stars{position:absolute;left:0;top:0;width:1px;height:1px;
  border-radius:50%;background:#fff}

/* ============ 2. PIXEL CONTRACT A — THE BADGE ============ */
.badge{left:488px;top:95px;width:198px;height:39px;border-radius:12px;z-index:300;
  border:1px solid rgba(255,255,255,.115);
  /* faint bank of light along the foot — aged gold into forest, per the brand */
  background:linear-gradient(to top,
    rgba(244,223,176,.15) 0px, rgba(214,178,106,.105) 2px, rgba(0,140,90,.075) 4px,
    rgba(0,107,61,.028) 6px, rgba(255,255,255,.012) 9px, rgba(255,255,255,.012) 100%);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035)}
/* The seal tile is gone, so the line IS the badge: the pill is 198x39 (still
   centred on x=587) and the type is fitted to a 12px cap inside it. The label
   spans the full pill and centres itself, which lets the fitter scale about the
   pill's own centre and keep the wordmark optically centred in every locale. */
.badge b{position:absolute;left:0;right:0;top:0;height:39px;
  display:flex;align-items:center;justify-content:center;
  transform-origin:50% 50%;
  font-size:15px;font-weight:400;color:rgba(255,255,255,.94);white-space:nowrap;
  padding-top:1.5px}

/* ============ 3. PIXEL CONTRACT B — THE GLOW BUTTON (used twice) ============
   The cyan bank at the foot is a BACKGROUND GRADIENT clipped by the button's own
   rounded rect via overflow:hidden. It is not a glow, not a shadow, not a bar. */
.btn{display:grid;place-items:center;color:#fff;position:relative;overflow:hidden;
  /* Same row-by-row light bank as the original contract, re-sampled onto the
     brand ramp: aged gold at the foot, through forest green, dying into the
     near-black body of the button. */
  background:linear-gradient(to top,
    #f4dfb0 1px, #e8ca82 2px, #d9b25c 3px, #c79a45 4px, #a8823a 5px,
    #6f9a4e 6px, #2f8f5c 7px, #0d7a4c 8px, #0a6b3d 9px, #075c34 10px,
    #064e2c 12px, #04401f 13px, #03341a 14px, #032b15 16px,
    #02220f 18px, #021b0c 20px, #02150a 24px, #011008 30px,
    #010c07 34px, #010c07 100%);
  box-shadow:
    inset 0 3px 3px -2px rgba(244,223,176,.10),
    inset 1px 0 0 rgba(255,255,255,.09),
    inset -1px 0 0 rgba(255,255,255,.09),
    var(--hair,0 1px 0 rgba(214,178,106,.42)),
    1px 0 0 rgba(214,178,106,.18), -1px 0 0 rgba(214,178,106,.18),
    0 0 8px rgba(0,140,90,.12),
    0 2px 5px -3px rgba(0,150,100,.45);
  transition:transform .25s,box-shadow .25s,filter .25s}
/* thin bright streak across the TOP edge only */
.btn::before{content:"";position:absolute;left:22%;right:38%;top:0.8px;height:1.9px;z-index:1;
  filter:blur(.55px);
  background:linear-gradient(90deg,rgba(244,223,176,0) 0%,rgba(244,223,176,.55) 34%,
    rgba(255,240,199,.74) 50%,rgba(244,223,176,.55) 66%,rgba(244,223,176,0) 100%)}
/* side edge-light, 13px inward falloff, MASKED so it attenuates up the button */
.btn::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;
  background:linear-gradient(90deg,rgba(244,223,176,.70),rgba(244,223,176,0) 13px),
             linear-gradient(270deg,rgba(244,223,176,.70),rgba(244,223,176,0) 13px);
  -webkit-mask:linear-gradient(to top,#000 0,#000 6px,rgba(0,0,0,.40) 12px,
    rgba(0,0,0,.15) 18px,rgba(0,0,0,.09) 24px,rgba(0,0,0,.02) 30px,rgba(0,0,0,.02) 100%);
          mask:linear-gradient(to top,#000 0,#000 6px,rgba(0,0,0,.40) 12px,
    rgba(0,0,0,.15) 18px,rgba(0,0,0,.09) 24px,rgba(0,0,0,.02) 30px,rgba(0,0,0,.02) 100%)}
.btn span{position:relative;z-index:2;display:block;line-height:1;
  text-shadow:0 1px 2px rgba(0,18,12,.5)}
.btn:hover{transform:translateY(-1px);filter:brightness(1.12);
  box-shadow:inset 0 1px 0 rgba(244,223,176,.6),inset 1px 0 0 rgba(214,178,106,.35),
             inset -1px 0 0 rgba(214,178,106,.35),0 6px 22px rgba(0,150,100,.5)}

/* instance A — nav CTA */
.nav .btn{position:absolute;left:530.7px;top:10.5px;width:125.5px;height:39.5px;
  border-radius:14px;font-size:14px;font-weight:500;letter-spacing:-.005em}
.nav .btn span{margin-top:0}
/* instance B — hero CTA */
.cta2{position:absolute;left:526px;top:349px;width:121px;height:54.5px;
  --hair:0 0 0 transparent;border-radius:13px;font-size:17px;font-weight:500;
  letter-spacing:-.01em;z-index:300}
.cta2::before{display:none}    /* the hero button has no top streak; the nav one does */
.cta2 span{margin-top:0}

/* ============ 4. NAV PILL ============ */
.nav{left:247px;top:3px;width:678px;height:64px;border-radius:32px;z-index:400;
  background:rgba(255,255,255,.008);
  border:1px solid rgba(255,255,255,.105);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  backdrop-filter:blur(16px) saturate(140%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}

/* The official lockup sits where the drawn mark used to. 124x63 source, held at
   30px tall so the wordmark stays legible without crowding the links. */
.brandlock{position:absolute;left:20px;top:0;height:100%;
  display:flex;align-items:center;text-decoration:none;
  transition:transform .3s cubic-bezier(.2,.9,.3,1),filter .3s}
.brandlock .mark{height:30px;width:auto;display:block;
  filter:drop-shadow(0 1px 5px rgba(0,0,0,.55)) drop-shadow(0 0 12px rgba(198,45,45,.32))}
.brandlock:hover{transform:scale(1.05)}
.brandlock:active{transform:scale(.99)}
.brandlock:focus-visible{outline:2px solid rgba(214,178,106,.85);outline-offset:4px;border-radius:6px}

.links{position:absolute;left:112px;top:0;height:62px;transform-origin:0 50%;
  display:flex;align-items:center;gap:24px}
.links a{position:relative;font-size:12.5px;font-weight:400;color:rgba(255,255,255,.92);
  white-space:nowrap;padding:4px 0;transition:color .25s}
/* a rule that wipes in from the left, plus a brief lift — enough to read as
   "this one is live" without the whole nav shifting */
.links a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.5px;
  background:linear-gradient(90deg,#d6b26a,#b68a3a);
  transform:scaleX(0);transform-origin:0 50%;
  transition:transform .32s cubic-bezier(.2,.9,.3,1)}
.links a:hover,.links a:focus-visible{color:#fff}
.links a:hover::after,.links a:focus-visible::after,.links a[aria-current]::after{transform:scaleX(1)}
.links a:focus-visible{outline:none}

/* ============ 5. HERO TYPE ============ */
.h1{left:586px;transform:translateX(-50%);white-space:nowrap;line-height:1;
  font-family:Poppins;font-weight:900;font-size:54px;letter-spacing:-.004em;
  word-spacing:.175em;text-transform:uppercase;color:#fff;
  text-shadow:0 0 34px rgba(214,178,106,.20);z-index:300}
.sub{left:586px;transform:translateX(-50%);white-space:nowrap;line-height:1;
  font-size:13.2px;color:#b0bcb4;z-index:300}
.sub b{font-weight:600;color:#fff}
.nb{white-space:nowrap}

/* ============ 6. THE CAROUSEL — a true 3D perspective ring ============ */
/* height:0 is a deliberate design-canvas convention — the shell is only a
   positioning context, and its children (ring, mock) are placed in canvas px */
.showcase{position:absolute;left:0;top:0;width:1172px;height:0}
.ring{position:absolute;left:0;top:0;width:1172px;height:657px;z-index:5;
  perspective:891px;perspective-origin:586px 918px;transform-style:preserve-3d;
  pointer-events:none}
.card{position:absolute;left:586px;top:616px;width:130px;height:300px;
  margin:-150px 0 0 -65px;border-radius:12px;overflow:hidden;background:#0d1117;
  box-shadow:0 24px 46px rgba(0,0,0,.6),0 3px 8px rgba(0,0,0,.5);
  backface-visibility:hidden;will-change:transform}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card img.cut{object-fit:contain;padding:7px}   /* the products are cut-outs, not photos */
.card .edge{position:absolute;inset:0;border-radius:12px;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.15),
             inset 0 16px 30px rgba(255,255,255,.05)}
.card.broken img{display:none}

/* shared creative sub-classes */
.cv{position:absolute;left:0;right:0;padding:0 10px}
.fill{position:absolute;inset:0}
.ph{position:absolute;left:0;right:0;overflow:hidden;background:none}
/* the dark wash is ONLY a broken-image placeholder — a loaded product cut-out
   must let the creative's own `fill` show through behind it */
.card.broken .ph{background:linear-gradient(155deg,#2b3b50,#131c28 60%,#1d1526)}
.phf{top:0;bottom:0}
.ph.nobg{background:none}          /* a pure overlay (the checkout glyphs) */
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:7px}
.dot{display:inline-block;width:4.5px;height:4.5px;background:#e5202f;
  margin-right:4px;transform:rotate(45deg) translateY(-1px)}
.dot.sq{transform:none;width:6.5px;height:4.5px;border-radius:1px}
.t-big{font-family:Poppins;font-weight:900;text-transform:uppercase;line-height:.96;
  letter-spacing:-.015em;white-space:nowrap;transform:scaleX(.875);
  transform-origin:left center}
.t-serif{font-family:"Playfair Display",serif;line-height:1.02;letter-spacing:.01em;
  white-space:nowrap}

/* ============ 9. THE BROWSER MOCK (in FRONT of the ring, bleeding off) ============ */
.browser{position:absolute;left:165px;top:558px;width:842px;
  height:calc(99px + var(--fill,0px));
  border-radius:28px 28px 0 0;overflow:hidden;z-index:100;
  box-shadow:0 -14px 44px rgba(0,0,0,.55)}
.browser::before{content:"";position:absolute;left:0;right:0;top:42px;bottom:0;
  background:rgba(0,28,20,.86);z-index:0}

.bar{position:absolute;left:0;top:0;width:100%;height:42px;
  background:linear-gradient(180deg,rgba(0,43,30,.55),rgba(0,28,20,.64));
  -webkit-backdrop-filter:blur(6px) saturate(112%);backdrop-filter:blur(6px) saturate(112%)}
.dots{position:absolute;left:27px;top:16px;display:flex;gap:2.6px}
.dots i{width:7.6px;height:7.6px;border-radius:50%}
.omni{position:absolute;left:246px;top:7px;width:336px;height:26px;border-radius:5px;
  background:rgba(0,24,17,.94);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);
  display:flex;align-items:center;justify-content:center;gap:6px}
.omni svg{width:9px;height:9px;opacity:.72}
.omni span{font-size:11px;color:rgba(255,255,255,.72);letter-spacing:.005em}
.sbar{position:absolute;right:94px;top:8px;height:26px;display:flex;align-items:center;
  gap:1px;padding:0 3px;border-radius:13px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10)}
.sbar button{appearance:none;border:0;background:transparent;cursor:pointer;
  height:20px;padding:0 8px;border-radius:10px;line-height:1;
  font:inherit;font-size:9.5px;font-weight:600;letter-spacing:.04em;
  color:rgba(255,255,255,.6);transition:color .2s,background .2s}
.sbar button:hover{color:#fff;background:rgba(255,255,255,.09)}
.sbar button:focus-visible{outline:2px solid rgba(214,178,106,.9);outline-offset:2px}
.sbar button[aria-pressed="true"]{color:#001f16;background:#d6b26a}
.sbar button[data-lang="zh"]{font-size:10.5px;letter-spacing:0}
.tools{position:absolute;right:27px;top:14px;display:flex;align-items:center;gap:4px;
  opacity:.9}
.tools svg{width:11px;height:12px}

.page{position:absolute;left:7px;right:6px;top:42px;bottom:0;background:#fff;
  color:#111;overflow:hidden;border-radius:10px 10px 0 0}
.ann{position:absolute;left:0;top:0;width:100%;height:16px;background:#00241a;
  display:grid;place-items:center;border-radius:10px 10px 0 0}
.ann span{font-size:7.2px;letter-spacing:.05em;color:#cfcfcf}
.ann u{position:absolute;font-size:8px;color:#9a9a9a;text-decoration:none}
.shoplogo{position:absolute;left:50%;transform:translateX(-50%);top:24px;text-align:center}
.shoplogo em{font-family:"Playfair Display",serif;font-style:normal;font-weight:600;
  font-size:19px;letter-spacing:.12em;line-height:1;display:block}
.shoplogo i{font-style:normal;font-size:6.6px;letter-spacing:.24em;color:#3a3a3a;
  margin-top:3px;display:block}
.shopicons{position:absolute;right:100px;top:33px;display:flex;gap:5px;opacity:.85}
.shopicons svg{width:7px;height:7px}

.pagebody{position:absolute;left:0;right:0;top:62px;bottom:0;background:#fff;overflow:hidden}
.pghero{position:relative;margin:0 26px;aspect-ratio:3/1;border-radius:7px;overflow:hidden;
  background:linear-gradient(120deg,#e8dcd4,#cbb6a8)}
.pghero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pghero .scrim{position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(28,20,16,.62) 0%,rgba(28,20,16,.30) 46%,rgba(28,20,16,0) 72%)}
.pghero .copy{position:absolute;left:22px;top:50%;transform:translateY(-50%);color:#fff}
.pghero .copy u{font-size:7px;letter-spacing:.2em;text-transform:uppercase;
  opacity:.9;display:block;text-decoration:none}
.pghero .copy em{font-family:"Playfair Display",serif;font-style:normal;font-weight:600;
  font-size:20px;line-height:1.14;margin-top:7px;display:block}
.pghero .copy i{font-style:normal;display:inline-block;margin-top:12px;padding:7px 16px;
  border-radius:20px;background:#fff;color:#17181c;font-size:7.4px;font-weight:600;
  letter-spacing:.06em}
.pgsec{display:flex;align-items:baseline;justify-content:space-between;margin:16px 26px 9px}
.pgsec b{font-family:"Playfair Display",serif;font-weight:600;font-size:13px;color:#17181c}
.pgsec u{font-size:7px;letter-spacing:.1em;color:#8a8a8a;text-transform:uppercase;
  text-decoration:none}
.pggrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:0 26px}
.pgcard .ph{position:relative;aspect-ratio:.62;border-radius:6px;
  overflow:hidden;background:linear-gradient(150deg,#efe7e1,#ddcfc6)}
.pgcard .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:9%}
.pgcard .tag{position:absolute;left:7px;top:7px;padding:3px 7px;border-radius:4px;
  background:#17181c;color:#fff;font-size:7px;font-weight:600;letter-spacing:.07em}
.pgcard b{display:block;margin-top:10px;font-size:9.8px;font-weight:600;color:#17181c;
  letter-spacing:.01em}
.pgcard i{display:block;font-style:normal;margin-top:4px;font-size:8.6px;color:#8a8a8a}
/* No price is published, and no contact line either: the tile itself is the
   control, and the enquiry CTA lives on the detail page it opens. */
.pgstrip{display:flex;justify-content:space-between;margin:16px 26px 0;padding:9px 0;
  border-top:1px solid #eee6e0;border-bottom:1px solid #eee6e0}
.pgstrip span{font-size:6.4px;letter-spacing:.08em;color:#7d7169;text-transform:uppercase}

/* ---- catalogue tile: a real button, so it is focusable and keyboard-usable ---- */
button.pgcard{display:block;width:100%;padding:0;border:0;background:none;
  font:inherit;color:inherit;text-align:left;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
button.pgcard .ph{display:block}
button.pgcard .ph img{transition:transform .35s cubic-bezier(.22,.61,.36,1)}
button.pgcard:hover .ph img{transform:scale(1.05)}
button.pgcard:hover b{color:#006b3d}
button.pgcard:focus-visible{outline:2px solid rgba(0,107,61,.7);outline-offset:3px;border-radius:6px}
.pgcard b{transition:color .2s}
/* With the contact line gone the tile carries no written cue, so the affordance
   moves into the image: a chevron that appears only while the tile is live. */
.pgcard .go{position:absolute;right:7px;bottom:7px;width:19px;height:19px;
  display:grid;place-items:center;border-radius:50%;
  background:rgba(0,107,61,.94);color:#fff;
  opacity:0;transform:scale(.6) translateY(3px);
  transition:opacity .24s ease,transform .28s cubic-bezier(.22,.61,.36,1)}
.pgcard .go::before{content:"";width:6px;height:6px;
  border-top:1.4px solid currentColor;border-right:1.4px solid currentColor;
  transform:rotate(45deg) translate(-1px,1px)}
button.pgcard:hover .go,button.pgcard:focus-visible .go{opacity:1;transform:scale(1) translateY(0)}

/* ---- product detail, swapped over the catalogue ---- */
.pgdetail{display:none}
.pagebody.detail .pgfront{display:none}
.pagebody.detail .pgdetail{display:block}
/* The way out has to be the first thing on the page, not a quiet link the
   visitor has to hunt for — it is a solid brand chip, full contrast. */
/* The pull-quote is the sentence a visitor should carry away; the gold rule
   and the serif italic lift it out of the body copy without shouting. */
.pdlegacy{margin:14px 0 0;padding:2px 0 2px 14px;border-left:3px solid #b68a3a;
  font-family:"Playfair Display",serif;font-style:italic;font-size:13.4px;line-height:1.5;
  color:#8a6a2c}
/* Recognition is a quiet footnote, not a badge: gold dot, small caps-ish weight. */
.pdaward{margin:16px 0 0;font-size:10.6px;line-height:1.5;color:#8a7a5a;
  display:flex;align-items:flex-start;gap:7px}
.pdaward i{flex:0 0 auto;width:6px;height:6px;margin-top:5px;border-radius:50%;
  background:#b68a3a;box-shadow:0 0 0 3px rgba(182,138,58,.16)}
.pdback{position:sticky;top:0;z-index:3;display:inline-flex;align-items:center;gap:7px;
  margin:0 0 16px;padding:9px 16px 9px 12px;
  border:0;border-radius:22px;background:#006b3d;color:#fff;cursor:pointer;
  font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  box-shadow:0 3px 10px -3px rgba(0,31,22,.5);
  transition:background .2s,transform .2s}
.pdback svg{width:13px;height:13px;stroke-width:2.6}
.pdback:hover{background:#008a48;transform:translateX(-2px)}
.pdback:focus-visible{outline:2px solid rgba(0,107,61,.7);outline-offset:3px}
.pdwrap{display:grid;grid-template-columns:minmax(0,33%) minmax(0,1fr);gap:30px;margin:0 26px 24px}
.pdmedia{min-width:0;display:flex;flex-direction:column;align-items:center}
.pdstage{position:relative;width:100%;aspect-ratio:3/4;
  border-radius:8px;overflow:hidden;
  background:linear-gradient(150deg,#efe7e1,#ddcfc6)}
.pdstage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:6%}
.pdstage .tag{position:absolute;left:10px;top:10px;padding:4px 8px;border-radius:4px;
  background:#17181c;color:#fff;font-size:6.4px;font-weight:600;letter-spacing:.1em}
.pdthumbs{display:flex;gap:8px;margin-top:10px;align-self:stretch;justify-content:center}
.pdthumb{width:50px;height:68px;padding:0;border:1px solid #e6dcd5;border-radius:5px;
  background:#f6f1ec;cursor:pointer;overflow:hidden;transition:border-color .2s}
.pdthumb img{width:100%;height:100%;object-fit:contain;padding:3px}
.pdthumb.on{border-color:#006b3d}
.pdthumb:focus-visible{outline:2px solid rgba(15,122,90,.55);outline-offset:2px}
.pdinfo{min-width:0}
.pdline{display:block;font-style:normal;font-size:9.6px;letter-spacing:.13em;
  text-transform:uppercase;color:#006b3d}
.pdname{font-family:"Playfair Display",serif;font-weight:600;font-size:30px;line-height:1.13;
  margin-top:10px;color:#17181c}
.pdtagline{margin-top:11px;font-size:12.4px;line-height:1.55;color:#6b5f57;font-style:italic}
.pdspecs{margin-top:16px;border-top:1px solid #eee6e0}
.pdspecs .row{display:grid;grid-template-columns:134px minmax(0,1fr);gap:12px;
  padding:9px 0;border-bottom:1px solid #f2ebe5}
.pdspecs .row b{font-size:9.4px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:#a08f86}
.pdspecs .row span{font-size:11.6px;line-height:1.5;color:#3a3330}
.pddesc{margin-top:14px;font-size:12px;line-height:1.72;color:#4a423e}
.pddesc+.pddesc{margin-top:11px}
.pdblock{margin-top:17px}
.pdblock>b{display:block;font-size:9.4px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:#17181c}
.pdblock ul{margin:10px 0 0;padding-left:17px}
.pdblock li{font-size:11.6px;line-height:1.62;color:#4a423e;margin-bottom:7px}
.pdblock ul.chips{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.pdblock ul.chips li{margin:0;padding:8px 15px;border-radius:20px;background:#f3ece6;
  font-size:10.8px;color:#5c514a}
.pdcta{margin-top:24px;width:auto;min-width:220px;height:48px;padding:0 28px;border-radius:13px;
  font-size:13px;font-weight:600;letter-spacing:.02em;display:inline-grid}

/* ================= STOREFRONT DRAWER =================
   The mock is authored to bleed off the bottom edge, which is right for the
   hero but leaves the store front unreachable — nothing on the page scrolls.
   So the mock becomes a pull-up drawer: it is translated up to the top of the
   stage and given the viewport's full height. The hero above it is untouched,
   so the authored composition is still exactly as designed until you pull. */
.browser{transition:none}
.browser.anim{transition:height .58s cubic-bezier(.22,.61,.36,1)}
.peekhint{position:absolute;left:50%;bottom:20px;z-index:320;
  display:inline-flex;align-items:center;gap:9px;height:38px;padding:0 17px;
  transform:translateX(-50%);border-radius:20px;cursor:pointer;
  background:rgba(0,26,19,.68);border:1px solid rgba(255,255,255,.13);
  -webkit-backdrop-filter:blur(14px) saturate(140%);
  backdrop-filter:blur(14px) saturate(140%);
  box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);
  color:rgba(255,255,255,.88);font-size:12.5px;font-weight:500;letter-spacing:.01em;
  white-space:nowrap;transition:opacity .3s,transform .3s,background .2s,color .2s;
  -webkit-tap-highlight-color:transparent}
.peekhint:hover{background:rgba(16,26,42,.8);color:#fff}
.peekhint:focus-visible{outline:2px solid rgba(182,138,58,.9);outline-offset:3px}
.peekhint svg{width:13px;height:13px;flex:0 0 auto;transition:transform .35s}
.peekhint .up{transform:rotate(180deg)}
/* once open, the affordance retreats to a small chevron so it never sits on
   top of the product grid it just revealed */
.stage.peek .peekhint{bottom:auto;top:16px;height:34px;padding:0 13px;
  font-size:0;gap:0;background:rgba(0,26,19,.58)}
.stage.peek .peekhint .lbl{display:none}
.stage.peek .peekhint svg{width:15px;height:15px}
.stage.peek .peekhint:hover{font-size:12.5px;padding:0 15px}
.stage.peek .peekhint:hover .lbl{display:inline}
/* Only once the drawer is open: on a short phone the full grid is taller than
   the revealed panel, so the store CONTENT scrolls inside it. It has to be
   .pagebody — that is the box that actually clips the grid. The authored
   closed state keeps overflow:hidden exactly as specified. */
.stage.peek .pagebody{overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
.stage.peek .pagebody::-webkit-scrollbar{width:0;height:0}
/* On a phone the showcase clips the cylinder (the ring is far wider than the
   screen). Once the drawer is open the mock has to be free to grow past that
   clip, so the shell stands down — the ring is off-screen by then anyway. */
.stage.peek .showcase{overflow:visible;height:0;min-height:0;flex:0 0 auto}
@media (prefers-reduced-motion:reduce){
  .canvas.anim,.browser.anim,.peekhint,.peekhint svg{transition:none}
}

/* One language control at a time. The store's own is authoritative while the
   store is up; the floating pill is an overlay on the stage and would otherwise
   sit on top of the store's address bar and its TSINGTAO header. This is
   deliberately at top level, NOT inside the reduced-motion block above — it was
   first written inside it, which meant it only applied to visitors who had
   reduced motion switched on, so the pill stayed invisible but still
   clickable on top of the store everywhere else. */
.lang{transition:translate .22s ease}
.stage.peek .lang{opacity:0;pointer-events:none;translate:0 -10px}

/* ================= EDITORIAL SHEET =================
   Same overlay contract as the lead form, so Escape, the focus trap and the
   focus return all behave identically whichever dialog is on top. */
.sheet{position:fixed;inset:0;z-index:420;display:grid;place-items:center;padding:24px;
  background:rgba(3,10,7,.74);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  animation:leadIn .3s ease both}
.sheet[hidden]{display:none}
.sheetpanel{position:relative;width:100%;max-width:600px;max-height:calc(100vh - 48px);
  overflow-y:auto;overscroll-behavior:contain;
  padding:32px 34px 30px;border-radius:22px;
  background:linear-gradient(180deg,#04241a,#001a13);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:0 40px 90px rgba(0,0,0,.66),inset 0 1px 0 rgba(255,255,255,.05);
  animation:leadPanel .42s cubic-bezier(.16,1,.3,1) both}
.sheetclose{position:absolute;right:16px;top:16px;width:32px;height:32px;padding:0;
  border:1px solid rgba(255,255,255,.14);border-radius:50%;
  background:rgba(255,255,255,.04);color:rgba(255,255,255,.8);cursor:pointer;
  display:grid;place-items:center;transition:background .2s,color .2s,transform .2s}
.sheetclose svg{width:15px;height:15px}
.sheetclose:hover{background:rgba(255,255,255,.12);color:#fff;transform:rotate(90deg)}
.sheetclose:focus-visible{outline:2px solid rgba(214,178,106,.85);outline-offset:3px}

.sheetkicker{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  color:#d6b26a;margin:0 0 8px}
.sheettitle{font-family:"Playfair Display",serif;font-weight:600;font-size:27px;
  line-height:1.2;margin:0;color:#fff;padding-right:38px}
.sheetsub{margin:11px 0 0;font-size:14px;line-height:1.65;color:#9fb3a8}

/* three headline numbers, because "over a hundred years" lands harder as digits */
.sheetstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 0}
.sheetstats div{padding:14px 12px;border-radius:14px;text-align:center;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07)}
.sheetstats b{display:block;font-family:"Playfair Display",serif;font-size:24px;
  line-height:1;color:#d6b26a}
.sheetstats span{display:block;margin-top:7px;font-size:10.5px;line-height:1.4;
  color:#93a89c}

/* the timeline rule runs behind the stops, so the century reads at a glance */
.sheetlist{list-style:none;margin:26px 0 0;padding:0 0 0 20px;position:relative}
.sheetlist::before{content:"";position:absolute;left:4px;top:7px;bottom:7px;width:1px;
  background:linear-gradient(180deg,#b68a3a,rgba(182,138,58,.12))}
.sheetlist li{position:relative;margin-bottom:20px}
.sheetlist li:last-child{margin-bottom:0}
.sheetlist li::before{content:"";position:absolute;left:-20px;top:5px;width:9px;height:9px;
  border-radius:50%;background:#001a13;border:2px solid #d6b26a;
  box-shadow:0 0 0 3px rgba(214,178,106,.14)}
.sheetlist b{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:#d6b26a}
.sheetlist p{margin:6px 0 0;font-size:13.5px;line-height:1.66;color:#b9c9c0}

/* the how-to reuses the same rail, but numbers the stops instead of dating them */
.sheetsteps{list-style:none;counter-reset:step;margin:24px 0 0;padding:0;position:relative}
.sheetsteps li{counter-increment:step;position:relative;margin-bottom:20px;
  padding:0 0 0 46px}
.sheetsteps li:last-child{margin-bottom:0}
.sheetsteps li::before{content:counter(step);position:absolute;left:0;top:0;
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  font-size:13px;font-weight:700;color:#001a13;
  background:linear-gradient(140deg,#e6c887,#b68a3a);
  box-shadow:0 0 0 4px rgba(214,178,106,.13)}
.sheetsteps b{display:block;font-size:15px;font-weight:600;color:#fff;line-height:1.3}
.sheetsteps p{margin:6px 0 0;font-size:13.5px;line-height:1.66;color:#b9c9c0}

.sheetnote{margin:24px 0 0;padding:14px 16px;border-radius:14px;
  background:rgba(214,178,106,.08);border:1px solid rgba(214,178,106,.2);
  font-size:12.5px;line-height:1.6;color:#d8c79c}
.sheetfoot{margin:24px 0 0;display:flex;gap:10px;flex-wrap:wrap}
.sheetfoot .btn{height:44px;padding:0 24px;border-radius:12px;font-size:14px}
.sheetfoot .sheetghost{background:transparent;color:#cfe0d6;
  border:1px solid rgba(255,255,255,.18)}
.sheetfoot .sheetghost:hover{background:rgba(255,255,255,.08);color:#fff}

/* ================= SUPPORT TOAST =================
   Drops from the top edge rather than opening a dialog: the answer is two taps
   away and should not cost the visitor the page they were on. */
.toast{position:fixed;left:50%;top:16px;z-index:440;width:max-content;max-width:min(420px,92vw);
  translate:-50% 0;pointer-events:none}
.toast[hidden]{display:none}
.toastcard{display:flex;gap:14px;align-items:flex-start;padding:15px 18px 15px 15px;
  border-radius:16px;
  background:linear-gradient(150deg,#06301f,#022017);
  border:1px solid rgba(214,178,106,.34);
  box-shadow:0 22px 54px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
  pointer-events:auto;
  animation:toastIn .46s cubic-bezier(.16,1,.3,1) both}
.toast.out .toastcard{animation:toastOut .3s ease forwards}
@keyframes toastIn{from{opacity:0;translate:0 -22px;scale:.96}to{opacity:1;translate:0 0;scale:1}}
@keyframes toastOut{to{opacity:0;translate:0 -14px;scale:.97}}
.toasticon{flex:0 0 auto;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
  color:#001a13;background:linear-gradient(140deg,#e6c887,#b68a3a);
  box-shadow:0 0 0 4px rgba(214,178,106,.14)}
.toasticon svg{width:19px;height:19px}
.toasttext{min-width:0}
.toasttext>b{display:block;font-size:9.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:#d6b26a}
.toastrow{display:flex;align-items:baseline;gap:8px;margin-top:7px;
  text-decoration:none;border-radius:6px}
.toastrow em{font-style:normal;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:#8fa79a;flex:0 0 auto;min-width:52px}
.toastrow span{font-size:14.5px;font-weight:600;color:#fff;word-break:break-all;
  transition:color .2s}
.toastrow:hover span{color:#e6c887}
.toastrow:focus-visible{outline:2px solid rgba(214,178,106,.85);outline-offset:3px}
.toasthours{margin:9px 0 0;font-size:10.5px;line-height:1.4;color:#8fa79a}
/* the bar is the auto-dismiss timer, made visible so nothing vanishes unexplained */
.toastbar{display:block;height:2px;margin:0 4px;border-radius:2px;
  background:linear-gradient(90deg,#d6b26a,#b68a3a);
  transform-origin:0 50%;animation:toastBar 7s linear forwards;pointer-events:none}
.toast.out .toastbar{animation:none;opacity:0}
@keyframes toastBar{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* ================= LEAD / ENQUIRY FORM =================
   Stage-level overlay, so it never disturbs the authored hero geometry. */
.lead{position:fixed;inset:0;z-index:400;display:grid;place-items:center;padding:24px;
  background:rgba(3,6,12,.72);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  animation:leadIn .3s ease both}
.lead[hidden]{display:none}
@keyframes leadIn{from{opacity:0}to{opacity:1}}
.leadpanel{position:relative;width:100%;max-width:560px;max-height:calc(100vh - 48px);
  overflow-y:auto;overscroll-behavior:contain;
  padding:30px 32px 26px;border-radius:22px;
  background:linear-gradient(180deg,#04241a,#001a13);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:0 40px 90px rgba(0,0,0,.66),inset 0 1px 0 rgba(255,255,255,.05);
  animation:leadPanel .42s cubic-bezier(.16,1,.3,1) both}
@keyframes leadPanel{from{opacity:0;translate:0 16px;scale:.985}to{opacity:1;translate:0 0;scale:1}}
.leadclose{position:absolute;right:16px;top:16px;width:32px;height:32px;padding:0;
  border:0;border-radius:10px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.7);
  cursor:pointer;display:grid;place-items:center;transition:background .2s,color .2s}
.leadclose svg{width:14px;height:14px}
.leadclose:hover{background:rgba(255,255,255,.12);color:#fff}
.leadclose:focus-visible{outline:2px solid rgba(182,138,58,.9);outline-offset:2px}
.leadkicker{font-size:10.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
  color:var(--tsg-gold)}
.leadtitle{font-family:"Playfair Display",serif;font-weight:600;font-size:27px;
  line-height:1.15;margin-top:8px;color:#fff}
.ledesub{margin-top:8px;font-size:13px;line-height:1.6;color:#9aa6b4;max-width:42ch}
.leadintro{padding-right:34px;margin-bottom:22px}
.leadgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.leadfield{display:flex;flex-direction:column;gap:6px;min-width:0}
.leadfield.wide{grid-column:1/-1}
.leadfield>span{font-size:11px;font-weight:600;letter-spacing:.06em;color:#c3ccd6}
.leadfield em{font-style:normal;color:var(--tsg-gold);margin-left:3px}
.leadfield input,.leadfield select,.leadfield textarea{
  font:inherit;font-size:13.5px;color:#fff;padding:11px 13px;border-radius:11px;
  border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.045);
  transition:border-color .2s,background .2s;width:100%}
.leadfield textarea{resize:vertical;min-height:78px;line-height:1.55}
.leadfield select{appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,#7c8794 50%),
                   linear-gradient(135deg,#7c8794 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
.leadfield select option{background:#04241a;color:#fff}
.leadfield input::placeholder,.leadfield textarea::placeholder{color:#5c6672}
.leadfield input:focus,.leadfield select:focus,.leadfield textarea:focus{
  outline:0;border-color:rgba(182,138,58,.8);background:rgba(182,138,58,.08)}
.leadfield input[aria-invalid="true"],.leadfield select[aria-invalid="true"]{
  border-color:#ff6b6b;background:rgba(255,107,107,.07)}
.leadcheck{display:flex;align-items:flex-start;gap:9px;margin-top:16px;
  font-size:12px;line-height:1.5;color:#9aa6b4;cursor:pointer}
.leadcheck input{width:15px;height:15px;margin:1px 0 0;accent-color:#006b3d;flex:0 0 auto;
  cursor:pointer}
.leadcheck input[aria-invalid="true"]{outline:2px solid #ff6b6b;outline-offset:2px}
.leaderr{margin-top:12px;font-size:12.5px;line-height:1.5;color:#ff8080;min-height:0}
.leaderr:empty{display:none}
.leadactions{margin-top:20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.leadcta{width:auto;min-width:196px;height:46px;padding:0 26px;border-radius:13px;
  font-size:14px;font-weight:600;letter-spacing:.005em;cursor:pointer;
  display:inline-grid;flex:0 0 auto}
.leadcta[disabled]{opacity:.55;cursor:progress}
.leadnote{font-size:11.5px;line-height:1.5;color:#6d7885;flex:1 1 180px;min-width:0}
.leaddone{text-align:center;padding:14px 0 4px}
.leaddone[hidden]{display:none}
.leaddone svg{width:44px;height:44px;color:var(--tsg-gold);margin-bottom:14px}
.leaddone h3{font-family:"Playfair Display",serif;font-weight:600;font-size:23px;color:#fff}
.leaddone p{margin:10px auto 14px;font-size:13.5px;line-height:1.6;color:#9aa6b4;
  max-width:40ch}
.leadsent{font-size:12px!important;color:#7d8a83!important;word-break:break-all}
.leaddonebtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
/* the ghost button reuses the bank at 0 strength, so the pair reads as
   primary + secondary without introducing a second button language */
.leadghost{background:var(--tsg-forest-900);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 2px 5px -3px rgba(0,0,0,.5)}
.leadghost:hover{box-shadow:inset 0 0 0 1px rgba(214,178,106,.5),0 4px 14px rgba(0,0,0,.4)}
@media (max-width:700px){
  .lead{padding:0;place-items:stretch}
  .leadpanel{max-width:none;max-height:100vh;height:100%;border-radius:0;
    padding:26px 20px calc(26px + env(safe-area-inset-bottom))}
  .leadtitle{font-size:23px}
  .ledesub{font-size:12.5px}
  .leadgrid{grid-template-columns:1fr;gap:13px}
  .leadactions{flex-direction:column;align-items:stretch}
  .leadcta{width:100%}
  .leadnote{text-align:center}
}

@media (prefers-reduced-motion:reduce){
  .lead,.leadpanel{animation:none}
}

/* ================= LANGUAGE SWITCH (outside .canvas, like .wa) =================
   Deliberately NOT inside the nav pill: the nav's 678px box and every child
   offset are part of the pixel contract, so the switch lives in the stage's own
   top-left corner and touches no authored coordinate. */
.lang{position:absolute;left:16px;top:24px;z-index:300;display:flex;gap:2px;
  padding:3px;border-radius:20px;
  background:rgba(0,26,19,.66);border:1px solid rgba(255,255,255,.10);
  -webkit-backdrop-filter:blur(14px) saturate(140%);
  backdrop-filter:blur(14px) saturate(140%);
  box-shadow:0 8px 24px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05)}
.lang button{appearance:none;border:0;background:transparent;cursor:pointer;
  min-width:34px;height:26px;padding:0 9px;border-radius:17px;
  font-family:inherit;font-size:11.5px;font-weight:600;line-height:1;
  letter-spacing:.02em;color:rgba(255,255,255,.62);
  transition:color .2s,background .2s;-webkit-tap-highlight-color:transparent}
.lang button:hover{color:#fff}
.lang button:focus-visible{outline:2px solid rgba(182,138,58,.9);outline-offset:2px}
.lang button[aria-pressed="true"]{color:#fff;
  background:linear-gradient(180deg,rgba(0,107,61,.55),rgba(0,59,38,.55));
  box-shadow:inset 0 0 0 1px rgba(182,138,58,.45),inset 0 1px 0 rgba(244,223,176,.22)}
.lang button[data-lang="zh"]{font-size:12.5px;letter-spacing:0}
@media (prefers-reduced-motion:reduce){.lang button{transition:none}}
html.intro .lang{opacity:0;translate:0 -9px}

/* floating WhatsApp button (outside .canvas, inside .stage) */
.fbtn{position:absolute;right:16px;bottom:24px;width:56px;height:56px;border-radius:50%;
  background:#25d366;display:grid;place-items:center;z-index:300;
  box-shadow:0 8px 20px rgba(0,0,0,.5)}
.fbtn svg{width:31px;height:31px}
/* Stacked pair: identical geometry via .fbtn, colour by modifier, and only the
   vertical offset differs so the two can never look mismatched. */
/* The mark is a filled white bubble, so it needs no plate behind it — a blue
   disc would only compete with the outline the mark already has. */
.fbtn.zalo{bottom:88px}
.fbtn.zalo img{width:30px;height:30px;display:block;border-radius:0}
.wa::after{content:"";position:absolute;inset:0;border-radius:50%;
  border:2px solid rgba(37,211,102,.5);animation:pulse 2.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.75}70%{transform:scale(1.4);opacity:0}
  100%{opacity:0}}

/* ============ 12. ENTRANCE — resting states ============
   Uses the INDIVIDUAL translate/scale/clip-path properties, NOT `transform`,
   because `transform` is already owned by the pixel-fitter and the ring loop.
   The individual properties compose instead of colliding. */
html.intro .nav{opacity:0;translate:0 -9px}
html.intro .mark, html.intro .wm, html.intro .links a, html.intro .nav .btn,
html.intro .burger{opacity:0;translate:0 6px}

/* ============ 10. SHARED NARROW-VIEWPORT NAV (<=1080px) ============ */
@media (max-width:1080px){
  .burger{display:grid;place-content:center;gap:4px;position:absolute;right:12px;top:11px;
    width:42px;height:42px;padding:0;border:0;border-radius:14px;background:transparent;

  .burger span{display:block;width:19px;height:1.6px;border-radius:2px;

@media (hover:hover) and (max-width:1080px){

@media (prefers-reduced-motion:reduce){
  .navmenu,.burger span{transition:none}
  .wa::after{animation:none}
  html.intro .nav,html.intro .mark,html.intro .wm,html.intro .links a,
  html.intro .nav .btn,html.intro .burger,html.intro .badge,html.intro .h1,

/* ============ 10b. TABLET 701-1080px ============
   1080 is where the desktop composition measurably stops holding: nav links fall
   below 10.3px and on portrait tablets the mock swells to 64-69% of the viewport. */
@media (min-width:701px) and (max-width:1080px){
  .nav{left:286px;width:620px}          /* narrows to logo + burger */
  .badge{left:488px;width:198px}        /* same pill, same centre as desktop */
  .stack{transform:translateY(var(--stshift,0px))}
  .showcase{transform:translateY(var(--sshift,0px))}
  .ring{transform:scale(var(--rs,1));transform-origin:586px 595px}
  .fbtn{width:58px;height:58px;right:22px;bottom:26px}
  .fbtn.zalo{bottom:92px}
  .fbtn svg{width:32px;height:32px}
}

/* ============ 10c. PHONE <=700px — a genuine flow column ============ */
@media (max-width:700px){
  .canvas{position:relative;left:auto;top:auto;width:100%;height:100%;
    transform:translateY(var(--peek,0px));
    display:flex;flex-direction:column;align-items:center;padding:0 20px}
  .canvas>*{position:static}
  .stack{display:contents}

  .nav{position:relative;left:auto;top:auto;width:100%;max-width:500px;height:58px;
    margin-top:clamp(46px,6.4vh,58px);flex:0 0 auto}
  /* logo lockup: the whole official lockup scales with the pill */
  .brandlock{left:14px}
  .brandlock .mark{height:28px}
  .burger{right:8px;top:7px;width:44px;height:44px}
  .navmenu{top:68px;padding:12px}
  .links a{font-size:16px;padding:12px 15px;border-radius:12px}
  .links a::after{display:none}
  .nav .btn{height:48px;margin-top:10px;font-size:16px}

  /* the badge becomes auto-width, but the tile stays pinned left and the label
     stays to its RIGHT via padding — it must still never overlap the tile */
  .badge{position:relative;left:auto;top:auto;margin-top:clamp(16px,2.6vh,26px);
    width:auto;max-width:100%;height:36px;flex:0 0 auto;border-radius:18px}
  .badge b{position:relative;left:auto;right:auto;top:auto;height:36px;
    padding:0 20px;font-size:14px}

  /* 7.4em sits between the width of "TSINGTAO" and "TSINGTAO PREMIUM", so the
     line break always lands balanced instead of orphaning the last word */
  .h1{position:relative;left:auto;top:auto;transform:none;white-space:normal;
    text-align:center;font-size:clamp(29px,8.4vw,36px);line-height:1.06;
    letter-spacing:-.01em;max-width:7.4em}
  .h1.l1{margin-top:clamp(12px,2.2vh,20px)}
  .sub{position:relative;left:auto;top:auto;transform:none;white-space:normal;
    text-align:center;font-size:clamp(14px,3.9vw,15.5px);line-height:1.5;max-width:340px}
  .sub.s1{margin-top:clamp(10px,1.8vh,16px)}
  .cta2{position:relative;left:auto;top:auto;margin-top:clamp(16px,2.6vh,26px);
    flex:0 0 auto;width:auto;min-width:158px;height:52px;padding:0 26px;font-size:16px}

  .showcase{position:relative;left:auto;top:auto;flex:1 1 auto;width:100%;height:auto;
    min-height:224px}
  /* the ring keeps its full 1172x657 3D geometry, just repositioned — and
     .showcase clips it, since the cylinder is far wider than any phone */
  .showcase{overflow:hidden}
  .ring{position:absolute;left:50%;margin-left:-586px;top:-446px;bottom:auto;
    width:1172px;height:657px;transform-origin:586px 466px;transform:scale(1.02)}
  /* the mock is a child of .showcase, so these offsets are measured from the
     showcase — which starts BELOW the hero — and it can never ride up over it.
     top+bottom (not auto height) is what gives the mock a real box. */
  .browser{position:absolute;left:50%;transform:translateX(-50%);top:212px;bottom:0;
    width:calc(100% + 40px);height:auto;border-radius:22px 22px 0 0}
  .browser .bar{height:36px}
  .omni{left:62px;right:200px;width:auto;transform:none;height:24px;top:6px}  /* .tools is display:none on phones, so the store's language switch takes the
     free right-hand slot — but the drawer's close button also moves to the top
     right on a phone (it would otherwise land on the floating pill), so the
     switch steps left of the close button rather than under it. */
  .sbar{right:92px}

  /* ---- the drawer, on a phone: deterministic instead of measured ----
     On this layout #canvas is a flow column, so the storefront's resting place
     is decided by however tall the hero happens to be — and the hero re-wraps
     to a different number of lines in every locale. Translating the canvas by a
     measured offset therefore drifts every time the language changes: measured
     EN->VI moved it 52px and EN->ZH 73px, leaving the store's address bar and
     its own language switch above the top of the screen and untappable.

     So the offset is dropped entirely and the hero leaves the flow. With .nav
     and .stack out of the way and .showcase taking the full height, the store
     starts at the top of the column by construction — in every locale, at every
     width, with nothing to re-measure. The desktop geometry keeps the measured
     translate; this is phone-only. */
  .stage.peek .canvas{transform:none}
  .stage.peek .nav,
  .stage.peek .stack{display:none}
  .stage.peek .showcase{height:100%;min-height:100%;flex:1 1 auto}
  /* the mock normally sits 212px down so it clears the hero carousel; with the
     hero out of the flow that offset would strand the store's address bar and
     language switch that far below the top edge */
  .stage.peek .browser{top:0}
  .omni span{font-size:9px}
  .dots{top:14px}
  .tools{display:none}
  .ann{height:15px} .ann span{font-size:6px} .page{top:36px}
  /* the mock is nearly full-bleed, so the store front reads as a real UI:
     two-up products and legible type */
  .pagebody{top:56px}
  .pghero{margin:0 18px;border-radius:10px}
  .pghero .copy{left:18px}
  .pghero .copy u{font-size:7.5px;letter-spacing:.2em}
  .pghero .copy em{font-size:20px;margin-top:5px}
  .pghero .copy i{font-size:8.5px;padding:6px 13px;margin-top:8px}
  .pgsec{margin:16px 18px 10px} .pgsec b{font-size:14px} .pgsec u{font-size:8px}
  .pggrid{grid-template-columns:repeat(2,1fr);gap:14px;margin:0 18px}
  .pgcard .ph{border-radius:9px}
  .pgcard .tag{font-size:7px;padding:3px 7px;border-radius:4px}
  .pgcard b{font-size:10.5px;margin-top:7px}
  .pgcard i{font-size:8.5px}
  .pgstrip{margin:16px 18px 0;flex-wrap:wrap;gap:5px 16px}
  .pgstrip span{font-size:8px}

  /* the detail page becomes a single column and re-types for a real phone */
  .pdback{font-size:11px;padding:9px 16px 9px 12px;margin-bottom:16px;gap:7px}
  .pdback svg{width:13px;height:13px}
  .pdwrap{grid-template-columns:1fr;gap:18px;margin:0 18px 22px}
  .pdstage{border-radius:12px}
  .pdstage .tag{left:11px;top:11px;font-size:7px;padding:4px 8px;border-radius:4px}
  .pdthumbs{gap:8px;margin-top:10px}
  .pdthumb{width:54px;height:70px;border-radius:7px}
  .pdline{font-size:9px;letter-spacing:.16em}
  .pdname{font-size:26px;margin-top:9px}
  .pdtagline{font-size:13px;margin-top:8px;line-height:1.55}
  .pdspecs{margin-top:16px}
  .pdspecs .row{grid-template-columns:124px minmax(0,1fr);gap:12px;padding:10px 0}
  .pdspecs .row b{font-size:10.5px}
  .pdspecs .row span{font-size:13.5px;line-height:1.5}
  .pddesc{font-size:15px;line-height:1.7;margin-top:14px}
  .pdblock{margin-top:18px}
  .pdblock>b{font-size:10.5px;letter-spacing:.1em}
  .pdblock ul{margin-top:8px;padding-left:18px}
  .pdblock li{font-size:13.5px;line-height:1.62;margin-bottom:7px}
  .pdblock ul.chips{gap:7px}
  .pdblock ul.chips li{font-size:12.5px;padding:8px 14px}
  .pdlegacy{margin-top:15px;padding-left:13px;font-size:14.6px}
  .pdaward{font-size:11.6px}
  .pdcta{min-width:0;width:100%;height:48px;font-size:15px;margin-top:22px}
  .fbtn{width:54px;height:54px;right:14px;bottom:16px}
  .fbtn svg{width:29px;height:29px}
  /* the pill nav is full-bleed on a phone, so the switch gets its own centred
     locale bar above it rather than floating over the logo or the store mock */
  .lang{left:50%;right:auto;top:10px;bottom:auto;transform:translateX(-50%)}
}

/* =====================================================================
   16. MOBILE PASS
   Everything that has to hold on a real handset, in ONE block at the end of
   the sheet. Two reasons it lives here rather than beside its component:

     - the phone architecture block (10c) sits late in the file, so a rule
       declared up next to the component it styles is silently overridden by
       it. Last position makes the cascade unambiguous.
     - the touch, coarse-pointer and safe-area fixes are not phone-width
       facts. A 1024px iPad is a touch device with a home indicator too, and
       those needs are unrelated to how narrow the viewport is.

   Verified across 320x568, 360x640, 375x667, 390x844, 412x915, 430x932,
   744x1133, 820x1180, 1024x768, 844x390 and 926x428: no horizontal overflow,
   the storefront is reachable from every one, and the product detail fits.
   ===================================================================== */

/* ---- reading sizes ----
   A phone is read at arm's length. Every size below is the desktop size plus
   roughly a third, which is the difference between legible and a squint. */
@media (max-width:700px){
  /* the storefront grid */
  .pgcard b{font-size:12.5px;margin-top:9px}
  .pgcard i{font-size:10.5px;margin-top:5px}
  .pgcard .tag{font-size:8.5px;padding:4px 8px}
  .pgsec{margin:18px 18px 11px}
  .pgsec b{font-size:16px}
  .pgsec u{font-size:10px}
  .pgstrip{margin:16px 18px 0;padding:11px 0}
  .pgstrip span{font-size:9px}

  /* the way out of a product, and the two editorial blocks around the prose */
  .pdback{font-size:12.5px;padding:11px 18px 11px 14px}
  .pdlegacy{font-size:15.5px;margin-top:16px;padding-left:13px}
  .pdaward{font-size:12.5px;margin-top:18px}

  /* the sheets were laid out for a 600px panel and waste a 390px screen */
  .sheetpanel{padding:26px 20px calc(24px + env(safe-area-inset-bottom))}
  .sheettitle{font-size:23px;padding-right:34px}
  .sheetsub{font-size:14.5px;margin-top:10px}
  .sheetstats{gap:8px;margin-top:20px}
  .sheetstats div{padding:12px 7px}
  .sheetstats b{font-size:20px}
  .sheetstats span{font-size:10.5px;margin-top:6px}
  .sheetlist,.sheetsteps{margin-top:22px}
  .sheetlist li,.sheetsteps li{margin-bottom:18px}
  .sheetsteps li{padding-left:42px}
  .sheetsteps li::before{width:27px;height:27px;font-size:12px}
  .sheetlist b{font-size:11.5px}
  .sheetlist p,.sheetsteps p{font-size:14px;line-height:1.62}
  .sheetsteps b{font-size:15.5px}
  .sheetnote{font-size:13px;padding:13px 14px;margin-top:22px}
  .sheetfoot .btn{height:48px;font-size:15px}

  /* the support toast */
  .toast{top:calc(10px + env(safe-area-inset-top));max-width:calc(100vw - 20px)}
  .toastcard{padding:14px 15px 14px 13px;gap:12px}
  .toasttext>b{font-size:10.5px}
  .toastrow{margin-top:8px;padding:3px 0}
  .toastrow em{font-size:11.5px;min-width:56px}
  .toastrow span{font-size:15.5px}
  .toasthours{font-size:11.5px;margin-top:10px}

  /* ---- touch targets: 44px is the floor, not a guideline ---- */
  .peekhint{min-height:48px;padding:0 18px}
  .peekhint span.lbl{font-size:11.5px}
  /* Open, the hint becomes the way back out and moves to the top centre — which
     on a phone is exactly where the centred locale bar sits (measured: hint
     174..217 at y16, locale bar 122..268 at y10). It goes to the top right
     instead, where there is nothing to collide with. */
  .stage.peek .peekhint{left:auto;right:14px;
    top:calc(10px + env(safe-area-inset-top));bottom:auto;
    width:44px;height:44px;min-height:44px;padding:0;border-radius:50%}
  .lang button{min-width:44px;min-height:38px;padding:0 11px;font-size:13px}

  /* iOS zooms the whole viewport when a focused field is under 16px, which
     strands the visitor panned into the middle of the form. 16px is the
     smallest size that does not trigger it. */
  .leadfield input,.leadfield select,.leadfield textarea{font-size:16px}
  .leadfield label,.leadfield .lbl{font-size:12px}
  .leadcheck span{font-size:12.5px}
  .leaderr{font-size:12.5px}
  .ledesub{font-size:13.5px}
  .leaddone h3{font-size:20px}
  .leaddone p{font-size:14px}

  /* ---- notches and home indicators: the edge elements move in ---- */
  .lang{top:calc(10px + env(safe-area-inset-top))}
  .fbtn{bottom:calc(16px + env(safe-area-inset-bottom));
      right:calc(14px + env(safe-area-inset-right))}
  .fbtn.zalo{bottom:calc(80px + env(safe-area-inset-bottom))}
  /* The floating contact button sits over the storefront as it scrolls, which is
     what a floating button does — but it must never be the thing covering the
     last row permanently. This much scroll space lets it clear. */
  .pagebody{padding-bottom:78px}
}

/* ---- TOUCH, AT ANY WIDTH ----
   A 1024px iPad gets no phone rules at all, but it is still a finger on glass:
   the nav links, the burger, the drawer hint and the locale switch are all
   under 40px tall there. Pointer type, not viewport width, is the real signal. */
@media (hover:none) and (pointer:coarse){
  .peekhint{min-height:48px}
  .burger{min-width:48px;min-height:48px}
  .lang button{min-width:44px;min-height:40px}
  .fbtn{min-width:56px;min-height:56px}
  .toastrow{padding:5px 0}
  .sheetclose{min-width:40px;min-height:40px}
  .pdthumb{min-height:44px}
  .links a{min-height:44px;display:flex;align-items:center}
  .nav .btn{height:48px}
  .pdback{min-height:46px}
  .pgcard .go{width:26px;height:26px;right:9px;bottom:9px}
  .pgcard .go::before{width:8px;height:8px}
}

/* ---- LANDSCAPE PHONE: measured, then left alone ----
   Tried a two-column landscape (hero left, carousel right) and it was wrong
   on both counts. Above 700px the tablet architecture is already in force, so
   the flow-column rules here fought the absolute canvas and the storefront
   mock measured 0px tall - the products became unreachable. Below 700px the
   column layout already does the right thing: the mock fills the viewport and
   the page body scrolls. Measured at 844x390 and 667x375 before the attempt:
   mock 390/375 tall, 10 products reachable, detail fits. So nothing is
   shipped here. */
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="bg" aria-hidden="true"></div>
  <div class="stars" id="stA" aria-hidden="true"></div>
  <div class="stars" id="stB" aria-hidden="true"></div>

  <div class="canvas" id="canvas">

    <!-- ================= NAV ================= -->
    <nav class="nav" id="nav">
      <!-- the official Tsingtao lockup, not a redrawn stand-in: the roundel and
           the wordmark are the brand, so neither is re-typed or re-coloured here -->
      <a class="brandlock" id="brandlock" href="#" aria-label="Tsingtao">
        <img class="mark" id="brandLogo" alt="Tsingtao" src="">
      </a>

      <div class="navmenu" id="navmenu">
        <div class="links" id="links" lang="zh-Hans">
          <a href="#" data-go="origin"  data-i18n="nav0"></a>
          <a href="#" data-go="guide"   data-i18n="nav1"></a>
          <a href="#" data-go="range"   data-i18n="nav2"></a>
          <a href="#" data-i18n="nav3" data-lead="nav-contact"></a>
          <a href="#" data-go="support" data-i18n="nav4"></a>
        </div>
          <a class="btn" href="#" data-lead="nav-cta"><span id="ctaLabel"></span></a>
      </div>

      <button class="burger" id="burger" type="button" aria-label="Opens menu"
              aria-expanded="false" aria-controls="navmenu">
        <span></span><span></span><span></span>
      </button>
    </nav>

    <!-- ================= HERO TYPE + BADGE + CTA ================= -->
    <div class="stack">
      <div class="badge" lang="zh-Hans">
        <b id="badgeTxt"></b>
      </div>

      <h1 class="h1 l1" id="h1a" lang="zh-Hans"></h1>
      <h1 class="h1" id="h1b" lang="zh-Hans"></h1>
      <p class="sub s1" id="sub1" lang="zh-Hans"></p>
      <p class="sub" id="sub2" lang="zh-Hans"></p>

      <a class="btn cta2" href="#" data-lead="hero-cta"><span id="vpLabel"></span></a>
    </div>

    <!-- ================= THE RING ================= -->
    <!-- The ring and the mock are siblings inside .showcase so the mock's
         containing block is the same box on every architecture. On desktop
         .showcase is a 1172x0 shell at the canvas origin, so the mock's design
         coordinates (165, 558) resolve exactly as authored. -->
    <div class="showcase" id="showcase">
      <div class="ring" id="ring" aria-hidden="true"></div>

      <!-- ================= THE BROWSER MOCK ================= -->
      <div class="browser" id="browser">
      <div class="bar">
        <div class="dots" aria-hidden="true"><i style="background:#ee5c62"></i><i style="background:#f6b719"></i><i style="background:#12c02f"></i></div>
        <div class="omni">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" aria-hidden="true" focusable="false">
            <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8" stroke-linecap="round"/>
          </svg>
          <span data-i18n="omni"></span>
        </div>
        <div class="sbar" role="group" aria-label="Language / Ngôn ngữ / 语言">
          <button type="button" data-lang="vi" aria-pressed="true" lang="vi">VI</button>
          <button type="button" data-lang="en" aria-pressed="false" lang="en">EN</button>
          <button type="button" data-lang="zh" aria-pressed="false" lang="zh">中文</button>
        </div>
        <div class="tools" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
            <path d="M12 16V4M8 8l4-4 4 4M4 15v5h16v-5"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" focusable="false">
            <path d="M12 5v14M5 12h14"/></svg>
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M12 3 3 8l9 5 9-5-9-5Z" fill="#fff" opacity=".95"/>
            <path d="M3 13l9 5 9-5" fill="none" stroke="#fff" stroke-width="2" opacity=".55" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <div class="page">
        <div class="ann">
          <u style="left:20px">&#8249;</u>
          <span data-i18n="ann"></span>
          <u style="right:20px">&#8250;</u>
        </div>

        <div class="shoplogo" lang="zh-Hans">
          <em data-i18n="shopA"></em>
          <i data-i18n="shopB"></i>
        </div>

        <div class="shopicons" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2" focusable="false">

/* ---- one translated string, with a per-language fallback to English ---- */
let LANG = 'vi';
const T = (o) => (o && (o[LANG] || o.en)) || '';
const L = () => I18N[LANG] || I18N.en;

/* =====================================================================
   INK TARGETS PER LOCALE.
   The fitter always nails two things exactly: the cap HEIGHT and the
   BASELINE. The ink WIDTH is the one measurement that cannot be shared across
   scripts — a CJK glyph is roughly square, so forcing it into the Latin
   reference measure would stretch "青岛啤酒" by ~2.7x. So each locale declares
   its own measure, chosen to sit within ~0.7-1.0x of the natural width of its
   own glyphs. Composition anchors (centre x=586, every baseline y) are
   untouched, so the design still holds together in all three.
   ===================================================================== */
const INK = {
  en: {h1a:563.5, h1b:197.5, sub1:389, sub2:311, badge:158, cta:87, vp:76, links:317},
  vi: {h1a:470,   h1b:222,   sub1:300, sub2:400, badge:158, cta:75, vp:72, links:262},
  zh: {h1a:264,   h1b:134,   sub1:146, sub2:278, badge:158, cta:62, vp:64, links:186}
};

/* Push the current locale into every [data-i18n] node and re-fit the type.
   The fitter runs afterwards because the hero strings changed length, and the
   hero's ink widths are re-derived from the new glyphs on every pass. */
function applyLang(lang, opts){
  const next = I18N[lang] ? lang : 'en';
  const changed = next !== LANG;
  LANG = next;
  const s = L();

  document.documentElement.lang = next === 'zh' ? 'zh-Hans' : next;
  document.title = s.docTitle;

  document.querySelectorAll('[data-i18n]').forEach(function(el){
    const v = s[el.dataset.i18n];
    if(v != null) el.innerHTML = v;
  });
  $('badgeTxt').textContent = s.badge;
  $('ctaLabel').textContent = s.navCta;
  $('vpLabel').textContent  = s.heroCta;
  $('h1a').innerHTML = s.h1a;
  $('h1b').innerHTML = s.h1b;
  $('sub1').innerHTML = s.sub1;
  $('sub2').innerHTML = s.sub2;
  const wa = document.querySelector('.wa');
  if(wa) wa.setAttribute('aria-label', s.wa);
  burger.setAttribute('aria-label', s.burger);
  hintEl.querySelector('.lbl').textContent = peeked ? s.peekClose : s.peekOpen;

  // every switch in the document, the hero pill and the store's own
  document.querySelectorAll('button[data-lang]').forEach(function(b){
    b.setAttribute('aria-pressed', b.dataset.lang === next ? 'true' : 'false');
  });

  renderStore();
  if(openProduct) openDetail(openProduct);   /* re-render the open detail in the new locale */
  if(sheetKind) openSheet(sheetKind);        /* same for an open sheet */
  if(!$('toast').hidden) showToast();        /* and for the support toast */
  const sc = $('sheetClose');
  if(sc) sc.setAttribute('aria-label', s.sheetAria);
  buildRing();          /* the card copy is baked into the markup, so it must be rebuilt */
  if(changed || !opts || !opts.silent) layout();
  /* On a phone #canvas is a flow column, so the hero's height decides where the
     storefront rests — and the hero re-wraps to a different number of lines in
     every locale. Measured: EN->VI shortened .stack by 58px, which slid the
     whole store up 58px while --peek kept the old value, pushing the store's
     address bar and the language switch off the top of the screen. The drawer
     offset has to be re-derived, not just re-laid-out. */
  if(peeked) setPeek(true, true);
  if(openProduct) reframe();   /* the stage is sized from the column width */
}

/* ================= starfield: two 1px dots, one giant box-shadow list ================= */
(function starfield(){
  function build(el, n, blur, lo, hi){
    const s = [];
    for(let i=0;i<n;i++){
      const x = Math.round(Math.random()*10000)/100;
      const y = Math.round(Math.random()*10000)/100;
      const a = (lo + Math.random()*(hi-lo)).toFixed(3);
      s.push(x + 'vw ' + y + 'vh ' + blur + 'px 0 rgba(255,255,255,' + a + ')');
    }
    el.style.boxShadow = s.join(',');
  }
  build(document.getElementById('stA'), 150, 0,    .05, .30);
  build(document.getElementById('stB'),  18, 1.2, .35, .70);
})();

function openSheet(kind){

  if(!data) return;
  const c = data[LANG] || data.en;
  sheetKind = kind;
  sheetLastFocus = document.activeElement;

  $('sheetBody').innerHTML =

    '<h2 class="sheettitle" id="sheetTitle">' + esc(c.title) + '</h2>' +
    '<p class="sheetsub">' + esc(c.sub) + '</p>' +
    (c.stats ? '<div class="sheetstats">' + c.stats.map(function(s){
        return '<div><b>' + esc(s[0]) + '</b><span>' + esc(s[1]) + '</span></div>';
      }).join('') + '</div>' : '') +
    '<ol class="' + (kind === 'guide' ? 'sheetsteps' : 'sheetlist') + '">' +
      (kind === 'guide'
        ? c.steps.map(function(s){
            return '<li><b>' + esc(s[0]) + '</b><p>' + esc(s[1]) + '</p></li>';
          }).join('')
        : c.list.map(function(s){
            return '<li><b>' + esc(s[0]) + '</b><p>' + esc(s[1]) + '</p></li>';
          }).join('')) +
    '</ol>' +
    '<p class="sheetnote">' + esc(c.note) + '</p>' +
    '<div class="sheetfoot">' +
      '<button type="button" class="btn" data-sheet-go="range"><span>' + esc(c.cta) + '</span></button>' +
      '<button type="button" class="btn sheetghost" data-sheet-go="contact">' + esc(c.cta2) + '</button>' +
    '</div>';

  $('sheetClose').setAttribute('aria-label', L().sheetAria);
  $('sheet').hidden = false;
  sheetReturn = null;
  setTimeout(function(){ $('sheetClose').focus(); }, 60);
  document.querySelectorAll('#links a').forEach(function(a){
    a.setAttribute('aria-current', a.dataset.go === kind ? 'true' : 'false');
  });
}

function closeSheet(){
  if($('sheet').hidden) return;
  $('sheet').hidden = true;
  $('sheetBody').innerHTML = '';

/* ---- frame follows the image ------------------------------------------------
   The product shots are cut-outs with tight alpha, so a fixed-ratio frame just
   pads them with empty background. Handing the frame the image's own ratio
   lets object-fit:contain fill it edge to edge, whatever the bottle or can
   shape happens to be. It re-runs on load and on every thumbnail swap, so it
   holds for all 10 products and all 3 locales without any hand-tuned numbers. */
/* The stage is sized FROM the image, not fitted into a preset box. A 1:3 bottle
   given a fixed frame either floats in empty beige (93% -> 36% of the frame
   used) or, given the image's own ratio, grows to 1000px tall. So: take the
   column's width, derive the height the product actually wants, cap the height
   so the page stays a sensible length, and let the width follow the cap down.
   The stage then always fills edge to edge AND never exceeds the cap. */
/* The cap has to know how much room there is. A fixed 470px fought the CSS
   max-height on short viewports and won the wrong way: at 390px tall the CSS
   clamped the JS height from 470 to 304, which broke the ratio and dropped the
   product back to 72% of its frame (measured on 844x390, 667x375, 320x568).
   A stage taller than about two thirds of the screen also pushes the specs
   table off the fold, which defeats the point of having them beside the shot. */
function stageMaxH(){
  return Math.max(180, Math.min(470, Math.round(window.innerHeight * 0.62)));
}
function matchFrame(img){
  var box = img.parentNode;
  if(!box || !img.naturalWidth) return;
  var col = box.parentNode;
  var colW = (col && col.clientWidth) || 0;
  if(!colW) return;                       // not laid out yet; resize will retry
  var ar = img.naturalWidth / img.naturalHeight;
  var h = Math.min(colW / ar, stageMaxH());
  var w = h * ar;
  box.style.width  = Math.round(w) + 'px';
  box.style.height = Math.round(h) + 'px';
}
/* Detail stages only. The store grid deliberately does NOT get this: ten tiles
   in a row have to share one frame ratio or the rows go ragged, and the CSS
   portrait frame already lifts a bottle from 33% fill to 50% on its own. */
function bindFrames(root){
  root.querySelectorAll('.pdstage img').forEach(function(im){
    if(im.dataset.framed) return;
    im.dataset.framed = '1';
    if(im.complete && im.naturalWidth) matchFrame(im);
    else im.addEventListener('load', function(){ matchFrame(im); }, {once:true});
  });
}

/* the column resized, so the stage has to be re-derived rather than stretched */
function reframe(){
  var im = document.querySelector('#pgdetail .pdstage img');
  if(im) matchFrame(im);
}

const RE_PHONE = /^[+]?[\d\s().-]{8,20}$/;
const RE_MAIL  = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

leadForm.addEventListener('submit', function(e){
  e.preventDefault();
  const s = L(), err = $('leadErr');
  const set = function(el, bad){ el.setAttribute('aria-invalid', bad ? 'true' : 'false'); return !bad; };
  let ok = true, firstBad = null;
  const fail = function(msg, el){
    if(ok) firstBad = el;
    err.textContent = msg; ok = false; set(el, true);
  };

  const name = $('lf-name'), phone = $('lf-phone'), mail = $('lf-email'),
        prod = $('lf-product'), consent = $('leadConsent');

  [name, phone, mail, prod].forEach(function(el){ el.removeAttribute('aria-invalid'); });
  consent.removeAttribute('aria-invalid');

  if(!name.value.trim())               fail(s.rName, name);
  else ok = ok && set(name, false);
  if(!phone.value.trim())              fail(s.rPhone, phone);
  else if(!RE_PHONE.test(phone.value)) fail(s.rPhoneFmt, phone);
  else ok = ok && set(phone, false);
  if(!mail.value.trim())               fail(s.rEmail, mail);
  else if(!RE_MAIL.test(mail.value))   fail(s.rEmailFmt, mail);
  else ok = ok && set(mail, false);
  if(!prod.value)                      fail(s.rProduct, prod);
  else ok = ok && set(prod, false);
  if(!consent.checked)                 fail(s.rConsent, consent);
  else consent.removeAttribute('aria-invalid');

  if(!ok){ err.textContent = err.textContent; if(firstBad) firstBad.focus(); return; }

  const data = {};
  LEAD_FIELDS.forEach(function(f){ data[f.name] = ($('lf-' + f.name).value || '').trim(); });
  data.consent = true;
  data.locale  = LANG;
  data.source  = leadReturn || 'unknown';
  data.sku     = (PRODUCT[data.product] || {}).sku || '';
  data.page    = location.href;

  const body = [
    'Họ tên / Name      : ' + data.name,
    'Điện thoại / Phone : ' + data.phone,
    'Email              : ' + data.email,
    'Công ty / Company  : ' + data.company,
    'Loại hình / Type   : ' + data.role,
    'Sản phẩm / Product : ' + ((PRODUCT[data.product] || {}).copy[LANG] || {}).name,
    'SKU                : ' + data.sku,
    'Số lượng / Qty     : ' + data.qty,
    'Địa chỉ / Address  : ' + data.address,
    'Ghi chú / Note     : ' + data.note,
    'Nguồn / Source     : ' + data.source,
    'Ngôn ngữ / Locale  : ' + data.locale,
    'Trang / Page       : ' + data.page
  ].join('\n');

  const btn = $('leadSubmit');
  btn.disabled = true;
  const mailto = 'mailto:' + SALES.email +
    '?subject=' + encodeURIComponent(SALES.subject) +
    '&body=' + encodeURIComponent(body);

  /* Confirmation is shown either way. With no endpoint configured we also hand
     the visitor a pre-filled mailto LINK and let them press send — silently
     navigating the page to mailto: is unreliable inside a frame and would
     otherwise strand the message. */
  const done = function(){
    document.querySelector('.leadactions').hidden = true;
    document.querySelector('.leadcheck').hidden = true;
    const mail = $('leadMail');
    mail.href = mailto;
    mail.hidden = !!SALES.endpoint;      // the POST already delivered it
    $('leadSent').textContent = SALES.endpoint ? '' : (SALES.email + ' · ' + L().leadMailTo);
    document.getElementById('leadDone').hidden = false;
    document.getElementById('leadClose2').focus();
  };

  if(!SALES.endpoint){ done(); return; }

  fetch(SALES.endpoint, {
    method:'POST',
    headers:{'Content-Type':'application/json','Accept':'application/json'},
    body: JSON.stringify(data)
  }).then(function(r){ if(!r.ok) throw new Error(r.status); return r; })
    .then(done)
    .catch(function(){
      btn.disabled = false;
      done();                            // never lose the enquiry
    });
});
